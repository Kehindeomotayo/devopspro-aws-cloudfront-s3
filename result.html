<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="DevOpsPro lab result score page."/>
<meta name="theme-color" content="#07111f"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<title>Lab Result - DevOpsPro</title>
<link rel="stylesheet" href="style.css?v=devops-lab-92"/>
</head>
<body class="theme-executive terminal-body">
<main class="terminal-page result-page" id="main">
  <section class="result-shell" aria-labelledby="result-title">
    <div class="exam-bar" aria-label="Lab result status">
      <div class="exam-brand">DevOpsPro Practice Lab</div>
      <div class="exam-meta">
        <span>Lab Result</span>
        <span>Workflow Result</span>
      </div>
    </div>
    <article class="result-card" id="result-panel" aria-live="polite">
      <span class="lab-kicker">Loading Result</span>
      <h1 id="result-title">Preparing your score...</h1>
    </article>
  </section>
</main>
<script src="script.js?v=devops-lab-92" defer></script>
</body>
</html>
